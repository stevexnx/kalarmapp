<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Tarjeta de Crédito Principal -->
    <rect x="0" y="32" width="320" height="200" rx="28" fill="#ffffff" fill-opacity="0.95" />
    <rect x="0" y="76" width="320" height="40" fill="#1e1b4b" />
    <rect x="36" y="148" width="60" height="44" rx="8" fill="#f59e0b" />
    <circle cx="256" cy="170" r="22" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="280" cy="170" r="22" fill="#f59e0b" fill-opacity="0.8" />
    
    <!-- Calendario Flotante con fecha de corte -->
    <g transform="translate(180, 150)">
      <rect x="0" y="0" width="130" height="120" rx="20" fill="#0f172a" stroke="#6366f1" stroke-width="4"/>
      <rect x="0" y="0" width="130" height="34" rx="20" fill="#4f46e5"/>
      <circle cx="34" cy="17" r="4" fill="#ffffff" />
      <circle cx="96" cy="17" r="4" fill="#ffffff" />
      <text x="65" y="85" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">30</text>
    </g>
  </g>
</svg>

